<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФГИС САТУРН - Выгрузка данных</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .section {
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #eee;
        }
        
        .section:last-child {
            border-bottom: none;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }
        
        textarea, input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            resize: vertical;
        }
        
        textarea {
            min-height: 80px;
        }
        
        input[type="text"] {
            font-size: 14px;
        }
        
        textarea:focus, input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: translateY(-1px);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
        }
        
        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }
        
        .message.show {
            display: block;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .download-link {
            display: inline-block;
            margin-top: 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .download-link:hover {
            text-decoration: underline;
        }
        
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .contractor-result {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .contractor-result.show {
            display: block;
        }
        
        .contractor-result h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        .contractor-field {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
        }
        
        .contractor-field:last-child {
            border-bottom: none;
        }
        
        .contractor-label {
            font-weight: 600;
            color: #666;
            width: 180px;
            flex-shrink: 0;
        }
        
        .contractor-value {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 ФГИС САТУРН</h1>
        <p class="subtitle">Выгрузка данных и поиск контрагентов</p>
        
        <div class="section">
            <h2 class="section-title">🔑 Авторизация</h2>
            <div class="form-group">
                <label for="tokenInput">Bearer токен:</label>
                <textarea id="tokenInput" placeholder="Вставьте токен авторизации...">{{ saved_token }}</textarea>
            </div>
            <div class="btn-group">
                <button class="btn-success" id="saveBtn" onclick="saveToken()">
                    Сохранить токен
                </button>
                <button class="btn-danger" id="clearBtn" onclick="clearToken()">
                    Очистить токен
                </button>
            </div>
        </div>
        
        <div class="section">
            <h2 class="section-title">📥 Выгрузка списка складов</h2>
            <div class="btn-group">
                <button class="btn-primary" id="exportBtn" onclick="exportData()" style="width: 100%;">
                    Выгрузить список складов
                </button>
            </div>
            <div id="exportMessage" class="message"></div>
        </div>
        
        <div class="section">
            <h2 class="section-title">🔍 Поиск контрагента по ИНН</h2>
            <div class="form-group">
                <label for="innInput">ИНН контрагента:</label>
                <input type="text" id="innInput" placeholder="Введите ИНН (например, 5029069967)" maxlength="12">
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="searchBtn" onclick="searchContractor()" style="width: 100%;">
                    Найти контрагента
                </button>
            </div>
            <div id="contractorMessage" class="message"></div>
            <div id="contractorResult" class="contractor-result">
                <h3>Информация о контрагенте</h3>
                <div id="contractorFields"></div>
            </div>
        </div>
        
        <div class="section">
            <h2 class="section-title">🚚 Накладные в пути</h2>
            <div class="btn-group">
                <button class="btn-primary" id="invoicesBtn" onclick="exportInvoices()" style="width: 100%;">
                    Выгрузить накладные в статусе "В пути"
                </button>
            </div>
            <div id="invoicesMessage" class="message"></div>
        </div>
    </div>
    
    <script>
        let currentToken = document.getElementById('tokenInput').value.trim();
        
        function showMessage(elementId, text, type = 'success') {
            const messageEl = document.getElementById(elementId);
            messageEl.textContent = text;
            messageEl.className = `message show ${type}`;
        }
        
        function setLoading(buttonId, isLoading) {
            const btn = document.getElementById(buttonId);
            if (isLoading) {
                btn.disabled = true;
                btn.dataset.originalText = btn.textContent;
                btn.innerHTML = '<span class="spinner"></span>' + btn.dataset.originalText;
            } else {
                btn.disabled = false;
                btn.textContent = btn.dataset.originalText || btn.textContent;
            }
        }
        
        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            
            if (!token) {
                showMessage('exportMessage', 'Введите токен', 'error');
                return;
            }
            
            fetch('/api/save-token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    currentToken = token;
                    showMessage('exportMessage', 'Токен сохранён', 'success');
                } else {
                    showMessage('exportMessage', result.message, 'error');
                }
            })
            .catch(() => {
                showMessage('exportMessage', 'Ошибка сохранения токена', 'error');
            });
        }
        
        function clearToken() {
            currentToken = null;
            document.getElementById('tokenInput').value = '';
            showMessage('exportMessage', 'Токен удалён', 'success');
        }
        
        function exportData() {
            const token = currentToken || document.getElementById('tokenInput').value.trim();
            
            if (!token) {
                showMessage('exportMessage', 'Введите токен и нажмите "Сохранить токен"', 'error');
                return;
            }
            
            setLoading('exportBtn', true);
            
            fetch('/api/export', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showMessage('exportMessage', `${result.message}. Файл готов к скачиванию.`, 'success');
                    
                    const downloadLink = document.createElement('a');
                    downloadLink.href = result.downloadUrl;
                    downloadLink.textContent = `📄 Скачать ${result.filename}`;
                    downloadLink.className = 'download-link';
                    downloadLink.style.display = 'block';
                    
                    const messageEl = document.getElementById('exportMessage');
                    const existingLink = messageEl.querySelector('.download-link');
                    if (existingLink) {
                        existingLink.remove();
                    }
                    messageEl.appendChild(downloadLink);
                } else {
                    showMessage('exportMessage', result.message, 'error');
                }
            })
            .catch(() => {
                showMessage('exportMessage', 'Ошибка выгрузки данных', 'error');
            })
            .finally(() => {
                setLoading('exportBtn', false);
            });
        }
        
        function searchContractor() {
            const token = currentToken || document.getElementById('tokenInput').value.trim();
            const inn = document.getElementById('innInput').value.trim();
            
            if (!token) {
                showMessage('contractorMessage', 'Введите токен и нажмите "Сохранить токен"', 'error');
                return;
            }
            
            if (!inn) {
                showMessage('contractorMessage', 'Введите ИНН', 'error');
                return;
            }
            
            setLoading('searchBtn', true);
            
            fetch('/api/contractor', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token, inn })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showMessage('contractorMessage', `${result.message}. Файл готов к скачиванию.`, 'success');
                    
                    const fields = result.data;
                    const fieldsHtml = Object.entries(fields).map(([key, value]) => `
                        <div class="contractor-field">
                            <span class="contractor-label">${key}:</span>
                            <span class="contractor-value">${value || '—'}</span>
                        </div>
                    `).join('');
                    
                    document.getElementById('contractorFields').innerHTML = fieldsHtml;
                    document.getElementById('contractorResult').classList.add('show');
                    
                    const downloadLink = document.createElement('a');
                    downloadLink.href = result.downloadUrl;
                    downloadLink.textContent = `📄 Скачать ${result.filename}`;
                    downloadLink.className = 'download-link';
                    downloadLink.style.display = 'block';
                    
                    const messageEl = document.getElementById('contractorMessage');
                    const existingLink = messageEl.querySelector('.download-link');
                    if (existingLink) {
                        existingLink.remove();
                    }
                    messageEl.appendChild(downloadLink);
                } else {
                    showMessage('contractorMessage', result.message, 'error');
                    document.getElementById('contractorResult').classList.remove('show');
                }
            })
            .catch(() => {
                showMessage('contractorMessage', 'Ошибка поиска контрагента', 'error');
                document.getElementById('contractorResult').classList.remove('show');
            })
            .finally(() => {
                setLoading('searchBtn', false);
            });
        }
        
        function exportInvoices() {
            const token = currentToken || document.getElementById('tokenInput').value.trim();
            
            if (!token) {
                showMessage('invoicesMessage', 'Введите токен и нажмите "Сохранить токен"', 'error');
                return;
            }
            
            setLoading('invoicesBtn', true);
            
            fetch('/api/invoices', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ token })
            })
            .then(response => response.json())
            .then(result => {
                if (result.success) {
                    showMessage('invoicesMessage', `${result.message}. Файл готов к скачиванию.`, 'success');
                    
                    const downloadLink = document.createElement('a');
                    downloadLink.href = result.downloadUrl;
                    downloadLink.textContent = `📄 Скачать ${result.filename}`;
                    downloadLink.className = 'download-link';
                    downloadLink.style.display = 'block';
                    
                    const messageEl = document.getElementById('invoicesMessage');
                    const existingLink = messageEl.querySelector('.download-link');
                    if (existingLink) {
                        existingLink.remove();
                    }
                    messageEl.appendChild(downloadLink);
                } else {
                    showMessage('invoicesMessage', result.message, 'error');
                }
            })
            .catch(() => {
                showMessage('invoicesMessage', 'Ошибка выгрузки данных', 'error');
            })
            .finally(() => {
                setLoading('invoicesBtn', false);
            });
        }
    </script>
</body>
</html>
